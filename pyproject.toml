[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "culvert-slope-risk-engine"
version = "1.0.0"
description = "Physics-informed computational hydrology and geotechnical slope stability engine for culvert infrastructure resilience."
authors = [{ name = "Peter Aryee", email = "paryee.geospatial@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "folium>=0.14.0",
    "pandas>=2.0.0"
]

[project.scripts]
culvert-risk = "run_pipeline:main"
